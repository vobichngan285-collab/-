name: Blue Star ORIGINAL Luna OCR-only portable (slim)
on:
  workflow_dispatch:
  push:
    branches: ['refactor/windows-luna-ocr-only-slim-20261112']
    paths:
      - 'game_reader/**'
      - 'main.py'
      - 'prepare_models.py'
      - 'requirements-win.txt'
      - 'requirements-legacy-tests.txt'
      - 'tests/**'
      - 'experiments/luna_original_full/**'
      - '.github/workflows/build-windows-luna-original.yml'
permissions:
  contents: read
# Only the latest new isolated experimental commit should build.
concurrency:
  group: luna-ocr-only-slim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-win.txt
      - name: Install lightweight ONNX and local Windows TTS
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-win.txt
          python -m pip install pyinstaller==6.16.0 pytest
          # Historical unit tests use RapidOCR, but it must NOT enter frozen EXE.
          python -m pip install -r requirements-legacy-tests.txt
          python -c "import rapidocr, onnxruntime; print('legacy TEST-only OCR installed')"
          python -c "from winrt.windows.media.speechsynthesis import SpeechSynthesizer; from winrt.windows.media.playback import MediaPlayer; print('WinRT speech installed')"
      - name: Test source syntax and screen coordinate logic
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed; do not build' }
          python -m compileall -q main.py game_reader
          if ($LASTEXITCODE -ne 0) { throw 'Syntax check failed; do not build' }
      - name: Build OCR-only front end without dead ONNX/OpenCV/Numpy
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed --name GameTextReader --collect-all winrt --collect-all tk_uia --exclude-module game_reader.ocr_backend --exclude-module rapidocr --exclude-module onnxruntime --exclude-module cv2 --exclude-module numpy --exclude-module scipy --exclude-module shapely main.py
          if ($LASTEXITCODE -ne 0) { throw 'Slim OCR-only freeze failed' }
          if (-not (Test-Path dist/GameTextReader/GameTextReader.exe)) { throw 'EXE missing' }
      - name: Install exact unchanged author release and GPLv3 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseUrl = 'https://github.com/HIllya51/LunaTranslator/releases/download/v12.1.3.9/LunaTranslator_x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'official_LunaTranslator_v12.1.3.9.zip'
          Invoke-WebRequest -Uri $releaseUrl -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'c0248288c12de19e9e1f953922355aaa123699820fce26e4e84329be2666d62f') {
            throw 'Official Luna release hash mismatch; do not build from modified archive'
          }
          $unpack = Join-Path $env:RUNNER_TEMP 'Luna_Verbatim_Official'
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $original = Join-Path $unpack 'LunaTranslator_x64/files/LunaSubprocess64.exe'
          $exeSha = (Get-FileHash $original -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeSha -ne '886892cd78cdd8bbd029a3f4977853cc1ddce1c9723e656986fa8b5a79e6a974') {
            throw 'Official unchanged LunaSubprocess64.exe SHA256 mismatch'
          }
          Copy-Item $original 'dist/GameTextReader/LunaSubprocess64.exe'
          $targetSha = (Get-FileHash dist/GameTextReader/LunaSubprocess64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($targetSha -ne $exeSha) { throw 'Copy modified the original Luna EXE' }
          Write-Output "PASS ORIGINAL AUTHOR EXE: size=$((Get-Item $original).Length), SHA256=$exeSha"

          $src = Join-Path $env:RUNNER_TEMP 'LunaTranslator_v12.1.3.9_original_source'
          git clone --depth 1 --branch v12.1.3.9 --filter=blob:none https://github.com/HIllya51/LunaTranslator.git $src
          if ($LASTEXITCODE -ne 0) { throw 'Official source clone failed' }
          $commit = (git -C $src rev-parse HEAD).Trim()
          if ($commit -ne '84677faeaa1e61bd7dd00b820090e9d2fe6c5142') {
            throw "Source is not pinned upstream release tag: $commit"
          }
          New-Item -ItemType Directory 'dist/GameTextReader/upstream_luna_original' -Force | Out-Null
          $sources = @{
            'windowstts.py' = 'src/LunaTranslator/tts/windowstts.py'
            'LunaSubProcess.py' = 'src/LunaTranslator/LunaSubProcess.py'
            'basettsclass.py' = 'src/LunaTranslator/tts/basettsclass.py'
            'msnaturalvoice.cpp' = 'src/NativeImpl/LunaSubprocess/msnaturalvoice.cpp'
            'pipehost.hpp' = 'src/NativeImpl/LunaSubprocess/pipehost.hpp'
            'LICENSE' = 'LICENSE'
          }
          foreach ($item in $sources.GetEnumerator()) {
            $from = Join-Path $src $item.Value
            $to = Join-Path 'dist/GameTextReader/upstream_luna_original' $item.Key
            Copy-Item $from $to -Force
            if ((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $to -Algorithm SHA256).Hash) {
              throw "Original author's source code was altered: $($item.Key)"
            }
          }
          $dest = Join-Path (Resolve-Path 'dist/GameTextReader').Path 'UPSTREAM_LUNA_GPL_SOURCE_v12.1.3.9.zip'
          git -C $src archive --format=zip --output=$dest HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dest)) {
            throw 'GPLv3 exact upstream source archive missing'
          }
          Write-Output 'PASS: exact original author executable and source archive are bundled'
      - name: Embed FULL ORIGINAL Luna x64 program, unchanged core, minimal local-only plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstream = Join-Path $env:RUNNER_TEMP 'Luna_Verbatim_Official/LunaTranslator_x64'
          $source = Join-Path $env:RUNNER_TEMP 'LunaTranslator_v12.1.3.9_original_source'
          $target = 'dist/GameTextReader/LunaOriginal/LunaTranslator_x64'
          if (-not (Test-Path (Join-Path $upstream 'LunaTranslator.exe'))) {
            throw 'Official full original main EXE not found'
          }
          New-Item -ItemType Directory (Split-Path $target) -Force | Out-Null
          Copy-Item $upstream $target -Recurse -Force
          $origFiles = @(Get-ChildItem $upstream -Recurse -File)
          foreach ($f in $origFiles) {
            $relative = $f.FullName.Substring($upstream.Length).TrimStart('\')
            $to = Join-Path $target $relative
            if (-not (Test-Path $to) -or
                (Get-FileHash $to -Algorithm SHA256).Hash -ne
                (Get-FileHash $f.FullName -Algorithm SHA256).Hash) {
              throw "Original full Luna runtime changed: $relative"
            }
          }
          Write-Output "PASS ALL $($origFiles.Count) ORIGINAL LUNA RUNTIME FILES BYTE IDENTICAL"
          # The only extra Python file is the BlueStar socket I/O bridge.
          # It calls original imageCutEx, ocr_run and ocrtext directly;
          # NONE of the author's OCR source modules are modified.
          $pluginFolder = Join-Path $target 'LunaTranslator/textio/textoutput'
          if (-not (Test-Path (Join-Path $pluginFolder 'websocket.py'))) {
            throw "Official original textoutput plugin folder was not found: $pluginFolder"
          }
          python -m py_compile 'experiments/luna_original_full/bluestar_outputer.py'
          if ($LASTEXITCODE -ne 0) { throw 'Luna control bridge failed Python syntax check' }
          Copy-Item 'experiments/luna_original_full/bluestar_outputer.py' (Join-Path $pluginFolder 'bluestar.py') -Force
          $configDir = Join-Path $target 'userconfig_bluestar'
          New-Item -ItemType Directory $configDir -Force | Out-Null
          # Isolated configuration, NOT the user's Luna installation.
          $defaults = (Get-Content (Join-Path $source 'src/LunaTranslator/defaultconfig/config.json') -Raw -Encoding UTF8 |
                       ConvertFrom-Json -AsHashtable)
          $defaults['sourcestatus2']['texthook']['use'] = $false
          $defaults['sourcestatus2']['ocr']['use'] = $true
          $defaults['textoutputer']['bluestar'] = @{ use=$true; origin=$true; trans=$false }
          $defaults['networktcpenable'] = $false
          $defaults['autorun'] = $true
          # Upstream author startup rule in LunaTranslator.py:
          # startupautohide=True prevents the pink Qt translation HUD from
          # appearing over the game. Keep the real Qt OCR worker alive.
          $defaults['startupautohide'] = $true
          $defaults['showintab'] = $false
          $defaults['ocr_translation_overlay'] = $false
          # Use the author's UNMODIFIED getresauto() PERIOD branch.
          # User's exact 400 ms between eligible full OCR calls after last OCR.
          $defaults['ocr_auto_method_v2'] = 'period'
          $defaults['ocr_interval'] = 0.4
          $defaults['multiregion'] = $true
          $defaults['ocr_text_diff'] = 5
          # Disable unused original translation, dictionaries, TTS, game
          # hooking, remote OCR and metadata. BlueStar already owns TTS/UI.
          foreach ($category in @('fanyi','cishu','reader','ocr')) {
            foreach ($name in @($defaults[$category].Keys)) {
              if ($defaults[$category][$name] -is [hashtable]) {
                $defaults[$category][$name]['use'] = ($category -eq 'ocr' -and $name -eq 'local')
              }
            }
          }
          foreach ($name in @($defaults['metadata'].Keys)) {
            if ($defaults['metadata'][$name] -is [hashtable]) { $defaults['metadata'][$name]['auto'] = $false }
          }
          foreach ($name in @($defaults['transoptimi'].Keys)) { $defaults['transoptimi'][$name] = $false }
          foreach ($name in @($defaults['sourcestatus2'].Keys)) {
            $defaults['sourcestatus2'][$name]['use'] = ($name -eq 'ocr')
          }
          $defaults['textoutputer']['clipboard']['use'] = $false
          $defaults['textoutputer']['websocket']['use'] = $false
          ($defaults | ConvertTo-Json -Depth 100) |
            Set-Content -Path (Join-Path $configDir 'config.json') -Encoding UTF8

          # Install the OFFICIAL Luna PP-OCRv6_small model pack via the SAME
          # /Resource/ocr_models manifest and ZIP used by the author's UI.
          # Do not use an unrelated RapidOCR v6 ONNX model or a v5 dictionary.
          python 'experiments/luna_original_full/install_official_v6small.py' $target
          if ($LASTEXITCODE -ne 0) { throw 'Official Luna PP-OCRv6_small model unavailable/invalid: refuse release' }
          $official = @(Get-ChildItem (Join-Path $target 'cache/ocrmodel') -Directory |
            Where-Object { $_.Name -like 'bluestar_official_*' })
          if ($official.Count -ne 1) { throw 'Expected exactly one official v6 Small model pack' }
          foreach ($n in @('det.onnx','rec.onnx','dict.txt','info.json')) {
            if (-not (Test-Path (Join-Path $official[0].FullName $n))) { throw "Official v6 model incomplete: $n" }
          }
          $modelInfo = Get-Content (Join-Path $official[0].FullName 'info.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($modelInfo.name -ne 'PP-OCRv6_small') { throw 'Model metadata does NOT identify PP-OCRv6_small' }

          # EXACT WHITELIST of the user's uploaded original OCR settings.
          # Never copy private config.json, license strings, keys or voice paths.
          $ocr = Get-Content (Join-Path $source 'src/LunaTranslator/defaultconfig/ocrsetting.json') -Raw -Encoding UTF8 | ConvertFrom-Json -AsHashtable
          $ocr['local']['args']['model'] = 'PP-OCRv6_small'
          $ocr['local']['args']['thread'] = 4
          $ocr['local']['args']['gpu'] = $true
          $ocr['local']['args']['luid'] = 0
          $ocr['local']['args']['device_type'] = 'CPU'
          ($ocr | ConvertTo-Json -Depth 100) |
            Set-Content -Path (Join-Path $configDir 'ocrsetting.json') -Encoding UTF8
          Write-Output 'VERIFY user OCR settings: PP-OCRv6_small / 4 threads / GPU requested / LUID=0 / device_type=CPU / 400ms period'
          Copy-Item 'experiments/luna_original_full/README_已接入蓝星的实验版.txt' (Join-Path $target 'README_已接入蓝星的实验版.txt')
          $originalArchive = Join-Path (Resolve-Path 'dist/GameTextReader/LunaOriginal').Path 'UPSTREAM_FULL_SOURCE_v12.1.3.9.zip'
          git -C $source archive --format=zip --output=$originalArchive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Full original source could not be bundled' }
          Write-Output "FULL ORIGINAL SOURCE INCLUDED: $originalArchive"

      - name: Windows smoke test ORIGINAL Luna GUI and 127.0.0.1 interface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cwd = (Resolve-Path 'dist/GameTextReader/LunaOriginal/LunaTranslator_x64').Path
          $exe = Join-Path $cwd 'LunaTranslator.exe'
          $proc = Start-Process -FilePath $exe -WorkingDirectory $cwd -ArgumentList @('--userconfig', 'userconfig_bluestar') -PassThru
          try {
            @'
          import socket, json, time
          def request(action, **kwargs):
              data = json.dumps(dict(action=action, **kwargs),
                                ensure_ascii=False).encode('utf-8') + b'\n'
              deadline = time.monotonic()+30
              while time.monotonic() < deadline:
                  try:
                      with socket.create_connection(('127.0.0.1',29380),timeout=1.4) as sock:
                          sock.settimeout(18)
                          sock.sendall(data)
                          reply = bytearray()
                          while b'\n' not in reply and len(reply)<2_000_000:
                              chunk=sock.recv(4096)
                              if not chunk:
                                  break
                              reply.extend(chunk)
                          if b'\n' not in reply:
                              raise ValueError('Truncated original OCR reply')
                          return json.loads(bytes(reply).split(b'\n')[0].decode('utf8'))
                  except (ConnectionRefusedError,ConnectionResetError,OSError):
                      time.sleep(0.25)
              raise RuntimeError('Official Luna IPC not responding: '+action)
          assert request('ping')['ok']
          print('PASS complete original Luna GUI and IPC')
          state = request('status')
          assert state.get('ok'), state
          detail = state['status']
          assert detail['strategy'] == 'period', detail
          assert abs(float(detail['interval_s']) - .4) < 0.0001, detail
          assert detail['main_window_hidden'] is True, detail
          assert detail['model'] == 'PP-OCRv6_small', detail
          assert detail['threads'] == 4, detail
          assert detail['gpu_requested'] is True, detail
          assert detail['gpu_luid'] == 0, detail
          assert detail['device_type'] == 'CPU', detail
          assert detail['multiregion'] is True, detail
          assert detail['ocr_text_diff'] == 5, detail
          print('PASS original Luna loaded USER settings: v6 Small / 4 threads / GPU=True / 400ms / hidden HUD', detail)
          for action,kwargs in [
              ('pause',{}),
              ('region',{'box':[100,80,410,240]}),
              ('border',{'visible':True})]:
              response=request(action,**kwargs)
              assert response.get('ok'), ('Original native Qt control FAILED',action,response)
              print('PASS original Luna Qt region API:',action)
          detail=request('status')['status']
          assert detail['original_region_count'] == 1, detail
          assert detail['original_regions_hidden'] is True, detail
          assert detail['main_window_hidden'] is True, detail
          print('PASS original Luna region runs with duplicate native region AND pink HUD hidden', detail)
          # Verify the REAL upstream PP-OCRv6_small path. Windows hosted CI
          # has no guaranteed physical GPU; no fake "GPU enabled" claim.
          response=request('ocr',box=[80,80,400,280])
          if response.get('ok'):
              assert isinstance(response.get('result'),dict), response
              assert isinstance(response['result'].get('results'),list), response
              print('PASS upstream v6 Small inference with requested GPU configuration',len(response['result']['results']))
          else:
              if detail['dml_provider_available']:
                  # DML being present is not proof a usable GPU exists.
                  print('WINDOWS-RUNNER GPU inference cannot be established:',str(response)[:400])
              else:
                  print('WINDOWS-RUNNER DML not available; GPU run requires user hardware:',str(response)[:400])
              print('GPU hardware not certified here. Model files and real loaded configuration verified; user GPU performance needs live test.')
          response=request('clear')
          assert response.get('ok'),response
          print('PASS original Luna clear after hidden-region OCR')
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw "Original complete OCR process failed IPC launch" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Validate OFFICIAL PP-OCRv6_small + matching dictionary on Windows CPU fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # GitHub's hosted Windows VM has no guaranteed physical GPU.
          # Verify original upstream v6 model and original inference with GPU
          # temporarily off, then restore the user's GPU=true settings.
          $cwd = (Resolve-Path 'dist/GameTextReader/LunaOriginal/LunaTranslator_x64').Path
          $cfgPath = Join-Path $cwd 'userconfig_bluestar/ocrsetting.json'
          $original = Get-Content $cfgPath -Raw -Encoding UTF8
          $saved = $original | ConvertFrom-Json -AsHashtable
          if (-not $saved['local']['args']['gpu'] -or
              $saved['local']['args']['model'] -ne 'PP-OCRv6_small') {
            throw "User's actual GPU/model config missing before CPU-only diagnostic"
          }
          try {
            $cpu = $original | ConvertFrom-Json -AsHashtable
            $cpu['local']['args']['gpu'] = $false
            ($cpu | ConvertTo-Json -Depth 100) | Set-Content $cfgPath -Encoding UTF8
            $exe = Join-Path $cwd 'LunaTranslator.exe'
            $proc = Start-Process -FilePath $exe -WorkingDirectory $cwd -ArgumentList @('--userconfig', 'userconfig_bluestar') -PassThru
            try {
              @'
          import json, socket, time
          deadline=time.monotonic()+32
          while time.monotonic()<deadline:
              try:
                  with socket.create_connection(('127.0.0.1',29380),timeout=1.1) as s:
                      s.settimeout(28)
                      s.sendall(b'{"action":"status"}\n')
                      response=b''
                      while b'\n' not in response:
                          part=s.recv(8192)
                          if not part: break
                          response+=part
                      state=json.loads(response.split(b'\n')[0])
                      assert state['ok'],state
                      assert state['status']['model']=='PP-OCRv6_small',state
                      assert state['status']['gpu_requested'] is False,state
                  break
              except (ConnectionRefusedError, ConnectionResetError, OSError):
                  time.sleep(.2)
          else:
              raise AssertionError("Original Luna CPU-only diagnostic process did not launch")
          with socket.create_connection(('127.0.0.1',29380),timeout=2) as s:
              s.settimeout(35)
              s.sendall(b'{"action":"ocr","box":[50,50,550,320]}\n')
              response=b''
              while b'\n' not in response:
                  part=s.recv(65536)
                  if not part: break
                  response+=part
              data=json.loads(response.split(b'\n')[0])
              assert data['ok'],("OFFICIAL v6 Small model failed to load/infer on CPU",data)
              assert isinstance(data.get('result'),dict),data
              assert isinstance(data['result'].get('results'),list),data
              print('PASS real upstream PP-OCRv6_small model+dict on CPU',len(data['result']['results']))
              print("GPU acceleration was NOT certified on hosted runner; only the user GPU request is preserved")
          '@ | python -
              if ($LASTEXITCODE -ne 0) { throw 'Original v6 Small ONNX+dict inference failed on CPU fallback' }
            } finally {
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            }
          } finally {
            [System.IO.File]::WriteAllText($cfgPath, $original, (New-Object System.Text.UTF8Encoding($false)))
          }
          $restored = Get-Content $cfgPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($restored.local.args.gpu -ne $true -or $restored.local.args.model -ne 'PP-OCRv6_small') {
            throw "GPU=true user configuration not restored before packaging"
          }
          Write-Output 'PASS exact original user GPU configuration restored and will ship'
      - name: Assert NONE of the abandoned RapidOCR/ONNX stack was shipped
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $internal = 'dist/GameTextReader/_internal'
          foreach ($name in @('rapidocr','onnxruntime','cv2','numpy','models','scipy','shapely')) {
            if (Test-Path (Join-Path $internal $name)) { throw "Dead engine still bundled: $name" }
          }
          if (Test-Path 'dist/GameTextReader/models') { throw 'Abandoned OCR weights still bundled' }
          Write-Output 'PASS NO bundled RapidOCR/ONNX/OpenCV/NumPy or old OCR weights'
      - name: Remove unused Luna translation, dictionaries, TTS, game Hook and legacy model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'dist/GameTextReader/LunaOriginal/LunaTranslator_x64').Path
          python -m py_compile 'experiments/luna_original_full/prune_original_luna.py' 'experiments/luna_original_full/smoke_trimmed_ocr.py'
          if ($LASTEXITCODE -ne 0) { throw 'Slim build scripts contain syntax errors' }
          python 'experiments/luna_original_full/prune_original_luna.py' $root
          if ($LASTEXITCODE -ne 0) { throw 'Safe OCR-only pruning failed' }
          if (Test-Path (Join-Path $root 'files/Magpie')) { throw 'Magpie was not removed' }
          if (Test-Path (Join-Path $root 'files/LunaHook')) { throw 'Hook binaries were not removed' }
          if (Test-Path (Join-Path $root 'files/ocrmodel')) { throw 'Default v5 model still present' }
          if (Test-Path (Join-Path $root 'LunaTranslator/translator/google.py')) {
            throw 'Translation provider was not removed'
          }
      - name: REAL Windows native OCR test AFTER author non-OCR modules are removed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'dist/GameTextReader/LunaOriginal/LunaTranslator_x64').Path
          python 'experiments/luna_original_full/smoke_trimmed_ocr.py' $root
          if ($LASTEXITCODE -ne 0) {
            throw 'Original Luna OCR FAILED after trim: block release'
          }
          # Do not let an OCR-only release re-ship old dependency environments.
          $internal = 'dist/GameTextReader/_internal'
          foreach ($name in @('rapidocr','onnxruntime','cv2','numpy','models')) {
            if (Test-Path (Join-Path $internal $name)) { throw "Found legacy model dependency: $name" }
          }
          Write-Output 'PASS AUTHOR OCR-ONLY BEHAVIOUR VERIFIED ON LIVE WINDOWS'
      - name: Verify bundled SAPI and WinRT voice API
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_tts_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-tts' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen EXE did not produce voice API verification' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Packaged speech API failed (exit=$($process.ExitCode))"
          }
      - name: Frozen installed-voice worker IPC smoke test (no license or model)
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          @'
          import json, subprocess
          from pathlib import Path
          exe = str(Path("dist/GameTextReader/GameTextReader.exe").resolve())
          request = {"command":"speak", "voice_id":"natural:MicrosoftWindows.Voice.zh-CN.Yunxi.1", "text":"你好", "config_path":""}
          result = subprocess.run([exe, "--luna-worker"], input=json.dumps(request)+"\n", capture_output=True, text=True, timeout=25)
          reply = json.loads(result.stdout.strip())
          assert reply["ok"] is False
          assert reply["stage"] in ("discovery_or_setup","synthesis","native_engine","unexpected","ipc_or_synthesis")
          assert "code" in reply
          print("PASS frozen worker protocol and classified error:", reply["stage"],reply["code"])
          # Probe a real frozen worker reading a local file with Unicode and
          # spaces in its pathname. Fake test value only; never ship a license.
          from tempfile import TemporaryDirectory
          with TemporaryDirectory(prefix="GameTextReader_语音 路径_") as local:
              config = Path(local) / "config.json"
              config.write_text(json.dumps({"MicrosoftWindows.Voice.License":
                                            "FAKE_TEST_VALUE_NOT_A_LICENSE"}), encoding="utf-8")
              for path, expected in ((str(config), "ok"),
                                     (str(Path(local) / "missing.json"),
                                      "local_voice_config_file_missing")):
                  req = {"command": "check_config", "config_path": path}
                  result = subprocess.run([exe, "--luna-worker"],
                      input=json.dumps(req, ensure_ascii=False)+"\n",
                      capture_output=True, text=True, encoding="utf-8", timeout=25)
                  answer = json.loads(result.stdout.strip())
                  assert answer["stage"] == "config_read", answer
                  assert answer["code"] == expected, answer
                  assert answer["ok"] == (expected == "ok"), answer
                  assert "FAKE_TEST_VALUE_NOT_A_LICENSE" not in str(answer)
                  assert path not in str(answer)
              print("PASS frozen worker config read with Unicode path and redacted results")
          # New protocol must read TWO independent requests with one frozen
          # worker process; before this revision each utterance restarted it.
          with TemporaryDirectory(prefix="GameTextReader_热语音_") as local:
              config = Path(local) / "config.json"
              config.write_text(json.dumps({"MicrosoftWindows.Voice.License":
                                            "FAKE_TEST_VALUE_NOT_A_LICENSE"}), encoding="utf-8")
              queries = [{"command":"check_config", "config_path":str(config)} for _ in range(2)]
              wire = "".join(json.dumps(q, ensure_ascii=False)+"\n" for q in queries)
              result = subprocess.run([exe, "--luna-worker"], input=wire,
                  capture_output=True, text=True, encoding="utf-8", timeout=25)
              replies = [json.loads(line) for line in result.stdout.splitlines()]
              assert len(replies) == 2, replies
              assert all(x == {"ok":True, "stage":"config_read", "code":"ok"} for x in replies)
              print("PASS frozen worker handles two requests in same process")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Frozen natural voice worker failed' }
          if (Test-Path 'dist/GameTextReader/config..json') {
