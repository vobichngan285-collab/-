name: Build FULL ORIGINAL Luna OCR bridge experiment
on:
  workflow_dispatch:
  push:
    branches: ['feat/windows-original-luna-ocr-bridge-20261112']
    paths:
      - 'game_reader/**'
      - 'main.py'
      - 'prepare_models.py'
      - 'requirements-win.txt'
      - 'tests/**'
      - 'experiments/luna_original_full/**'
      - '.github/workflows/build-windows-luna-original.yml'
permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-win.txt
      - name: Install lightweight ONNX and local Windows TTS
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-win.txt
          python -m pip install pyinstaller==6.16.0 pytest
          python -c "import rapidocr, onnxruntime; print('rapidocr',rapidocr.__file__);print('onnxruntime',onnxruntime.__version__)"
          python -c "from winrt.windows.media.speechsynthesis import SpeechSynthesizer; from winrt.windows.media.playback import MediaPlayer; print('WinRT speech installed')"
      - name: Test source syntax and screen coordinate logic
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed; do not build' }
          python -m compileall -q main.py game_reader
          if ($LASTEXITCODE -ne 0) { throw 'Syntax check failed; do not build' }
      - name: Prepare original V1.2 Small DET + REC weights only
        shell: pwsh
        run: |
          python prepare_models.py
      - name: Build lean portable EXE folder
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed --name GameTextReader --collect-data rapidocr --collect-binaries onnxruntime --collect-all winrt --collect-all tk_uia --add-data 'models;models' main.py
          if (-not (Test-Path dist/GameTextReader/GameTextReader.exe)) { throw 'EXE missing' }
      - name: Install exact unchanged author release and GPLv3 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseUrl = 'https://github.com/HIllya51/LunaTranslator/releases/download/v12.1.3.9/LunaTranslator_x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'official_LunaTranslator_v12.1.3.9.zip'
          Invoke-WebRequest -Uri $releaseUrl -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'c0248288c12de19e9e1f953922355aaa123699820fce26e4e84329be2666d62f') {
            throw 'Official Luna release hash mismatch; do not build from modified archive'
          }
          $unpack = Join-Path $env:RUNNER_TEMP 'Luna_Verbatim_Official'
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $original = Join-Path $unpack 'LunaTranslator_x64/files/LunaSubprocess64.exe'
          $exeSha = (Get-FileHash $original -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeSha -ne '886892cd78cdd8bbd029a3f4977853cc1ddce1c9723e656986fa8b5a79e6a974') {
            throw 'Official unchanged LunaSubprocess64.exe SHA256 mismatch'
          }
          Copy-Item $original 'dist/GameTextReader/LunaSubprocess64.exe'
          $targetSha = (Get-FileHash dist/GameTextReader/LunaSubprocess64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($targetSha -ne $exeSha) { throw 'Copy modified the original Luna EXE' }
          Write-Output "PASS ORIGINAL AUTHOR EXE: size=$((Get-Item $original).Length), SHA256=$exeSha"

          $src = Join-Path $env:RUNNER_TEMP 'LunaTranslator_v12.1.3.9_original_source'
          git clone --depth 1 --branch v12.1.3.9 --filter=blob:none https://github.com/HIllya51/LunaTranslator.git $src
          if ($LASTEXITCODE -ne 0) { throw 'Official source clone failed' }
          $commit = (git -C $src rev-parse HEAD).Trim()
          if ($commit -ne '84677faeaa1e61bd7dd00b820090e9d2fe6c5142') {
            throw "Source is not pinned upstream release tag: $commit"
          }
          New-Item -ItemType Directory 'dist/GameTextReader/upstream_luna_original' -Force | Out-Null
          $sources = @{
            'windowstts.py' = 'src/LunaTranslator/tts/windowstts.py'
            'LunaSubProcess.py' = 'src/LunaTranslator/LunaSubProcess.py'
            'basettsclass.py' = 'src/LunaTranslator/tts/basettsclass.py'
            'msnaturalvoice.cpp' = 'src/NativeImpl/LunaSubprocess/msnaturalvoice.cpp'
            'pipehost.hpp' = 'src/NativeImpl/LunaSubprocess/pipehost.hpp'
            'LICENSE' = 'LICENSE'
          }
          foreach ($item in $sources.GetEnumerator()) {
            $from = Join-Path $src $item.Value
            $to = Join-Path 'dist/GameTextReader/upstream_luna_original' $item.Key
            Copy-Item $from $to -Force
            if ((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $to -Algorithm SHA256).Hash) {
              throw "Original author's source code was altered: $($item.Key)"
            }
          }
          $dest = Join-Path (Resolve-Path 'dist/GameTextReader').Path 'UPSTREAM_LUNA_GPL_SOURCE_v12.1.3.9.zip'
          git -C $src archive --format=zip --output=$dest HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dest)) {
            throw 'GPLv3 exact upstream source archive missing'
          }
          Write-Output 'PASS: exact original author executable and source archive are bundled'
      - name: Embed FULL ORIGINAL Luna x64 program, unchanged core, minimal local-only plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstream = Join-Path $env:RUNNER_TEMP 'Luna_Verbatim_Official/LunaTranslator_x64'
          $source = Join-Path $env:RUNNER_TEMP 'LunaTranslator_v12.1.3.9_original_source'
          $target = 'dist/GameTextReader/LunaOriginal/LunaTranslator_x64'
          if (-not (Test-Path (Join-Path $upstream 'LunaTranslator.exe'))) {
            throw 'Official full original main EXE not found'
          }
          New-Item -ItemType Directory (Split-Path $target) -Force | Out-Null
          Copy-Item $upstream $target -Recurse -Force
          $origFiles = @(Get-ChildItem $upstream -Recurse -File)
          foreach ($f in $origFiles) {
            $relative = $f.FullName.Substring($upstream.Length).TrimStart('\')
            $to = Join-Path $target $relative
            if (-not (Test-Path $to) -or
                (Get-FileHash $to -Algorithm SHA256).Hash -ne
                (Get-FileHash $f.FullName -Algorithm SHA256).Hash) {
              throw "Original full Luna runtime changed: $relative"
            }
          }
          Write-Output "PASS ALL $($origFiles.Count) ORIGINAL LUNA RUNTIME FILES BYTE IDENTICAL"
          # The only extra Python file is the BlueStar socket I/O bridge.
          # It calls original imageCutEx, ocr_run and ocrtext directly;
          # NONE of the author's OCR source modules are modified.
          $pluginFolder = Join-Path $target 'LunaTranslator/textio/textoutput'
          if (-not (Test-Path (Join-Path $pluginFolder 'websocket.py'))) {
            throw "Official original textoutput plugin folder was not found: $pluginFolder"
          }
          Copy-Item 'experiments/luna_original_full/bluestar_outputer.py' (Join-Path $pluginFolder 'bluestar.py') -Force
          $configDir = Join-Path $target 'userconfig_bluestar'
          New-Item -ItemType Directory $configDir -Force | Out-Null
          # Isolated configuration, NOT the user's Luna installation.
          $defaults = (Get-Content (Join-Path $source 'src/LunaTranslator/defaultconfig/config.json') -Raw -Encoding UTF8 |
                       ConvertFrom-Json -AsHashtable)
          $defaults['sourcestatus2']['texthook']['use'] = $false
          $defaults['sourcestatus2']['ocr']['use'] = $true
          $defaults['textoutputer']['bluestar'] = @{ use=$true; origin=$true; trans=$false }
          $defaults['networktcpenable'] = $false
          $defaults['autorun'] = $true
          # The author's full MS-SSIM algorithm, NOT a custom 128x72 threshold.
          $defaults['ocr_auto_method_v2'] = 'analysis'
          ($defaults | ConvertTo-Json -Depth 100) |
            Set-Content -Path (Join-Path $configDir 'config.json') -Encoding UTF8
          Copy-Item 'experiments/luna_original_full/README_已接入蓝星的实验版.txt' (Join-Path $target 'README_已接入蓝星的实验版.txt')
          $originalArchive = Join-Path (Resolve-Path 'dist/GameTextReader/LunaOriginal').Path 'UPSTREAM_FULL_SOURCE_v12.1.3.9.zip'
          git -C $source archive --format=zip --output=$originalArchive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Full original source could not be bundled' }
          Write-Output "FULL ORIGINAL SOURCE INCLUDED: $originalArchive"

      - name: Windows smoke test ORIGINAL Luna GUI and 127.0.0.1 interface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cwd = (Resolve-Path 'dist/GameTextReader/LunaOriginal/LunaTranslator_x64').Path
          $exe = Join-Path $cwd 'LunaTranslator.exe'
          $proc = Start-Process -FilePath $exe -WorkingDirectory $cwd -ArgumentList @('--userconfig', 'userconfig_bluestar') -PassThru
          try {
            @'
          import socket, json, time
          deadline = time.monotonic() + 25
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 29380), timeout=1) as s:
                      s.settimeout(2)
                      s.sendall(b'{"action":"ping"}\n')
                      response = b''
                      while b'\n' not in response:
                          chunk = s.recv(4096)
                          if not chunk:
                              break
                          response += chunk
                      data = json.loads(response.split(b'\n')[0].decode())
                      assert data.get("ok"), data
                      assert "original" in data.get("implementation","").lower(), data
                      print("PASS actual original Luna OCR GUI + local-only adapter:", data)
                      break
              except (OSError, ValueError, AssertionError) as exc:
                  time.sleep(0.2)
          else:
              raise RuntimeError("Full original Luna GUI IPC did not initialize")
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw "Original complete OCR process failed IPC launch" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Remove duplicated RapidOCR model weights
        shell: pwsh
        run: |
          # Our app loads explicit files from _internal/models, not rapidocr/models.
          # --collect-data rapidocr otherwise duplicates all four weights.
          $extra = 'dist/GameTextReader/_internal/rapidocr/models'
          foreach ($name in @('PP-OCRv6_det_small.onnx','PP-OCRv6_rec_small.onnx','PP-OCRv6_det_medium.onnx','PP-OCRv6_rec_medium.onnx')) {
            $duplicate = Join-Path $extra $name
            if (Test-Path $duplicate) {
              Remove-Item $duplicate -Force
              Write-Output "Removed redundant weight: $name"
            }
          }
          # Original V1.2 always passes use_cls=False, so classifying weights are unused.
          $clsFiles = @(Get-ChildItem dist/GameTextReader/_internal/rapidocr -Recurse -Filter '*cls*.onnx' -ErrorAction SilentlyContinue)
          foreach ($file in $clsFiles) {
            Remove-Item $file.FullName -Force
            Write-Output "Removed unused classifier: $($file.Name)"
          }
      - name: Verify bundled models
        shell: pwsh
        run: |
          $names = @('PP-OCRv6_det_small.onnx','PP-OCRv6_rec_small.onnx')
          foreach ($name in $names) {
            $file = Join-Path "dist/GameTextReader/_internal/models" $name
            if (-not (Test-Path $file)) { throw "Missing offline ONNX: $name" }
          }
          # This experimental bundle deliberately includes TWO independent
          # systems: the untouched author's original full OCR model and the
          # legacy Small model retained only for frozen EXE self-test/rollback.
          # The shipped app delegates recognition ONLY to original Luna.
          $legacy = @(Get-ChildItem "dist/GameTextReader/_internal/models" -Filter '*.onnx' -File)
          if ($legacy.Count -ne 2) { throw "Expected 2 legacy frozen self-test weights, got $($legacy.Count)" }
          $original = @(Get-ChildItem "dist/GameTextReader/LunaOriginal/LunaTranslator_x64/files/ocrmodel" -Recurse -Filter '*.onnx' -File)
          if ($original.Count -ne 2) { throw "Expected 2 official Luna bundled model weights, got $($original.Count)" }
          $allOnnx = @(Get-ChildItem "dist/GameTextReader" -Recurse -Filter '*.onnx')
          if (@($allOnnx).Count -ne 4) { throw "Expected 4 separately bundled weights (2 legacy + 2 original), got $(@($allOnnx).Count)" }
          foreach ($file in $allOnnx) {
            if ($file.Name -match '(?i)medium') { throw 'Medium OCR model must not ship' }
          }
      - name: Truly execute frozen EXE and test original V1.2 Small OCR
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_ocr_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-ocr' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen GUI EXE did not create the OCR verification log' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Frozen OCR failed; exit=$($process.ExitCode)"
          }
      - name: Verify bundled SAPI and WinRT voice API
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_tts_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-tts' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen EXE did not produce voice API verification' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Packaged speech API failed (exit=$($process.ExitCode))"
          }
      - name: Frozen installed-voice worker IPC smoke test (no license or model)
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          @'
          import json, subprocess
          from pathlib import Path
          exe = str(Path("dist/GameTextReader/GameTextReader.exe").resolve())
          request = {"command":"speak", "voice_id":"natural:MicrosoftWindows.Voice.zh-CN.Yunxi.1", "text":"你好", "config_path":""}
          result = subprocess.run([exe, "--luna-worker"], input=json.dumps(request)+"\n", capture_output=True, text=True, timeout=25)
          reply = json.loads(result.stdout.strip())
          assert reply["ok"] is False
          assert reply["stage"] in ("discovery_or_setup","synthesis","native_engine","unexpected","ipc_or_synthesis")
          assert "code" in reply
          print("PASS frozen worker protocol and classified error:", reply["stage"],reply["code"])
          # Probe a real frozen worker reading a local file with Unicode and
          # spaces in its pathname. Fake test value only; never ship a license.
          from tempfile import TemporaryDirectory
          with TemporaryDirectory(prefix="GameTextReader_语音 路径_") as local:
              config = Path(local) / "config.json"
              config.write_text(json.dumps({"MicrosoftWindows.Voice.License":
                                            "FAKE_TEST_VALUE_NOT_A_LICENSE"}), encoding="utf-8")
              for path, expected in ((str(config), "ok"),
                                     (str(Path(local) / "missing.json"),
                                      "local_voice_config_file_missing")):
                  req = {"command": "check_config", "config_path": path}
                  result = subprocess.run([exe, "--luna-worker"],
                      input=json.dumps(req, ensure_ascii=False)+"\n",
                      capture_output=True, text=True, encoding="utf-8", timeout=25)
                  answer = json.loads(result.stdout.strip())
                  assert answer["stage"] == "config_read", answer
                  assert answer["code"] == expected, answer
                  assert answer["ok"] == (expected == "ok"), answer
                  assert "FAKE_TEST_VALUE_NOT_A_LICENSE" not in str(answer)
                  assert path not in str(answer)
              print("PASS frozen worker config read with Unicode path and redacted results")
          # New protocol must read TWO independent requests with one frozen
          # worker process; before this revision each utterance restarted it.
          with TemporaryDirectory(prefix="GameTextReader_热语音_") as local:
              config = Path(local) / "config.json"
              config.write_text(json.dumps({"MicrosoftWindows.Voice.License":
                                            "FAKE_TEST_VALUE_NOT_A_LICENSE"}), encoding="utf-8")
              queries = [{"command":"check_config", "config_path":str(config)} for _ in range(2)]
              wire = "".join(json.dumps(q, ensure_ascii=False)+"\n" for q in queries)
              result = subprocess.run([exe, "--luna-worker"], input=wire,
                  capture_output=True, text=True, encoding="utf-8", timeout=25)
              replies = [json.loads(line) for line in result.stdout.splitlines()]
              assert len(replies) == 2, replies
              assert all(x == {"ok":True, "stage":"config_read", "code":"ok"} for x in replies)
              print("PASS frozen worker handles two requests in same process")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Frozen natural voice worker failed' }
          if (Test-Path 'dist/GameTextReader/config..json') {
            throw 'Never bundle any private voice configuration'
          }
          if (-not (Test-Path 'dist/GameTextReader/LunaSubprocess64.exe')) {
            throw 'Unmodified official Luna executable missing'
          }
          if (-not (Test-Path 'dist/GameTextReader/UPSTREAM_LUNA_GPL_SOURCE_v12.1.3.9.zip')) {
            throw 'Upstream source license archive missing'
          }
      - name: Test packaged UI Automation and click-through frame
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_ui_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-ui' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen EXE did not create UI test log' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Frozen UI/overlay test failed (exit=$($process.ExitCode))"
          }
      - name: Exercise frozen picker three times in real Windows Tk
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_picker_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-picker' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen EXE did not generate picker smoke-test log' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Frozen picker failed, exit=$($process.ExitCode)"
          }
      - name: Launch full frozen V1.2 Tk application for startup verification
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_app_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-app' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen EXE did not create app startup log' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Full V1.2 application startup failed (exit=$($process.ExitCode))"
          }
      - name: Assemble ONLY portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Compress-Archive -Path dist/GameTextReader -DestinationPath release/GameTextReader_FixedRegion_ThreeModes_Experimental_Windows_x64.zip -CompressionLevel Optimal -Force
          $size = (Get-Item release/GameTextReader_FixedRegion_ThreeModes_Experimental_Windows_x64.zip).Length
          Write-Output "Portable archive size: $size bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: GameTextReader-FixedRegion-ThreeModes-Experimental
          path: release/GameTextReader_FixedRegion_ThreeModes_Experimental_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Verify portable ZIP and publish new isolated experimental release
        if: github.ref_name == 'feat/windows-original-luna-ocr-bridge-20261112'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $original = 'release/GameTextReader_FixedRegion_ThreeModes_Experimental_Windows_x64.zip'
          if (-not (Test-Path $original)) { throw 'Verified Windows ZIP missing' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $original).Path)
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            if ($names -notcontains 'GameTextReader/GameTextReader.exe') { throw 'No packaged EXE in release ZIP' }
            if (-not ($names -match 'UPSTREAM_LUNA_GPL_SOURCE_v12.1.3.9.zip')) { throw 'Missing original GPL source' }
            $count = 0
            foreach ($entry in $archive.Entries) {
              if ($entry.Name -eq '') { continue }
              $stream = $entry.Open()
              try { $stream.CopyTo([System.IO.Stream]::Null) } finally { $stream.Dispose() }
              $count++
            }
            Write-Output "PASS ZIP extraction and all $count entry reads"
          } finally { $archive.Dispose() }
          $out = 'release/BlueStarOCR_FullOriginalLunaIntegrated_Windows_x64.zip'
          Copy-Item $original $out
          git archive --format=zip --output='release/BlueStarOCR_FullOriginalLunaIntegrated_Source.zip' HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          foreach ($file in @($out, 'release/BlueStarOCR_FullOriginalLunaIntegrated_Source.zip')) {
            Write-Output "$file SHA256=$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()) size=$((Get-Item $file).Length)"
          }
          $tag = 'win-full-original-luna-integrated-20261112'
          $notes = @"
          Experimental GameTextReader plus FULL original LunaTranslator v12.1.3.9 OCR runtime.
          Based on November 11 previously functional BlueStar Windows UI and the one-line F7 fix.
          OCR requests now execute inside the author's complete untouched Luna executable:
          original imageCutEx, original ocr_run, upstream CVUtils local OCR engine,
          original ocrtext.getresauto task scheduling, original MS-SSIM image analysis,
          original region window and original OCR text postprocessing.
          BlueStar only sends screen coordinates to the original process and
          receives upstream text/boxes through a tiny LOCAL ONLY 127.0.0.1 adapter.
          BlueStar no longer runs its own image capture or image change loop in region mode.
          Full original runtime and original full source code are included with GPLv3 license.
          This is a test build, not a proven FPS optimization. DirectX game FPS and
          Chinese text recognition must be tested by the user before adopting.
          The original Luna GUI may be visible initially; leave the original session
          running while BlueStar uses its OCR. F11 passes selection to original Luna.
          Never overwrite older known-working installations or private TTS configs.
          "@
          gh release create $tag $out 'release/BlueStarOCR_FullOriginalLunaIntegrated_Source.zip' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'Blue Star OCR - FULL ORIGINAL Luna backend integrated (experimental)'  --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,assets,url
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
