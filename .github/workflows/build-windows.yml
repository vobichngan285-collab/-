name: Blue Star Fast Single Engine
on:
  workflow_dispatch:
  push:
    branches: ['refactor/windows-fast-single-engine-20261112']
    paths:
      - 'game_reader/**'
      - 'main.py'
      - 'prepare_models.py'
      - 'requirements-win.txt'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Blue Star offline OCR dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-win.txt
          python -m pip install pyinstaller==6.16.0 pytest
          python -c "import rapidocr,onnxruntime as ort;print('providers=',ort.get_available_providers())"
      - name: Test code and screen selection
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Get-Location).Path
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          python -m compileall -q main.py game_reader
          if ($LASTEXITCODE -ne 0) { throw 'Source syntax failed' }
      - name: Prepare exact original V1.2 PP-OCRv6 Small model weights
        shell: pwsh
        run: |
          python prepare_models.py
          if ($LASTEXITCODE -ne 0) { throw 'V1.2 models could not be prepared' }
      - name: Build single OCR engine EXE
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed --name GameTextReader --collect-data rapidocr --collect-binaries onnxruntime --collect-all winrt --collect-all tk_uia --add-data 'models;models' main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (-not (Test-Path dist/GameTextReader/GameTextReader.exe)) { throw 'EXE missing' }
      - name: Strip redundant OCR models and forbid Luna OCR runtime
        shell: pwsh
        run: |
          $extra='dist/GameTextReader/_internal/rapidocr/models'
          if (Test-Path $extra) {
            Get-ChildItem $extra -Recurse -Filter '*.onnx' | Remove-Item -Force
          }
          $all=@(Get-ChildItem dist/GameTextReader -Recurse -Filter '*.onnx')
          if ($all.Count -ne 2) { throw "Expected ONLY 2 Small models, found $($all.Count)" }
          foreach ($name in @('PP-OCRv6_det_small.onnx','PP-OCRv6_rec_small.onnx')) {
            if (-not (Test-Path "dist/GameTextReader/_internal/models/$name")) { throw "Missing $name" }
          }
          if (Test-Path 'dist/GameTextReader/LunaOriginal') { throw 'Luna OCR app unexpectedly included' }
          if (Test-Path 'dist/GameTextReader/_internal/CVUtils.dll') { throw 'Luna OCR DLL unexpectedly included' }
      - name: Keep only the existing authorized natural voice helper
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'LunaTranslator_v12.1.3.9.zip'
          Invoke-WebRequest -Uri 'https://github.com/HIllya51/LunaTranslator/releases/download/v12.1.3.9/LunaTranslator_x64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c0248288c12de19e9e1f953922355aaa123699820fce26e4e84329be2666d62f') { throw 'Official voice package hash mismatch' }
          $unpack=Join-Path $env:RUNNER_TEMP 'LunaVoiceOnly'
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $voice=Join-Path $unpack 'LunaTranslator_x64/files/LunaSubprocess64.exe'
          if ((Get-FileHash $voice -Algorithm SHA256).Hash.ToLowerInvariant() -ne '886892cd78cdd8bbd029a3f4977853cc1ddce1c9723e656986fa8b5a79e6a974') { throw 'Voice binary hash mismatch' }
          Copy-Item $voice 'dist/GameTextReader/LunaSubprocess64.exe'
          $src=Join-Path $env:RUNNER_TEMP 'LunaVoiceGPL'
          git clone --depth 1 --branch v12.1.3.9 --filter=blob:none https://github.com/HIllya51/LunaTranslator.git $src
          if ($LASTEXITCODE -ne 0) { throw 'Voice helper source clone failed' }
          if ((git -C $src rev-parse HEAD).Trim() -ne '84677faeaa1e61bd7dd00b820090e9d2fe6c5142') { throw 'Voice helper source hash mismatch' }
          git -C $src archive --format=zip --output='dist/GameTextReader/UPSTREAM_VOICE_GPL_SOURCE.zip' HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot bundle source of natural voice helper' }
      - name: Exercise frozen OCR/TTS/UIA/picker/application
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          foreach ($t in @('ocr','tts','ui','picker','app')) {
            $log=Join-Path $env:TEMP ("GameTextReader_"+$t+"_selftest.txt")
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath $exe -ArgumentList "--self-test-$t" -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path $log)) { throw "$t frozen self-test failed" }
            $report=Get-Content $log -Raw
            Write-Output ($t+': '+$report)
            if (-not $report.StartsWith('PASS')) { throw "$t frozen self-test failed" }
          }
          if (Test-Path 'dist/GameTextReader/config..json') { throw 'Private config unexpectedly bundled' }
      - name: Assemble clean independent Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Compress-Archive -Path dist/GameTextReader -DestinationPath release/BlueStarOCR_FastSingleEngine_Windows_x64.zip -CompressionLevel Optimal -Force
          git archive --format=zip --output='release/BlueStarOCR_FastSingleEngine_Source.zip' HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $archive=[System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'release/BlueStarOCR_FastSingleEngine_Windows_x64.zip').Path)
          try {
            $names=@($archive.Entries | ForEach-Object FullName)
            if ($names -notcontains 'GameTextReader/GameTextReader.exe') { throw 'Missing EXE in ZIP' }
            if ($names -match 'LunaOriginal|CVUtils.dll|PP-OCRv6_det_medium') { throw 'Extraneous Luna OCR or Medium model found' }
            foreach ($entry in $archive.Entries) {
              if (-not $entry.Name) { continue }
              $stream=$entry.Open()
              try { $stream.CopyTo([System.IO.Stream]::Null) } finally { $stream.Dispose() }
            }
            Write-Output "PASS ZIP with $($archive.Entries.Count) entries"
          } finally { $archive.Dispose() }
          Get-ChildItem release -Filter '*.zip' | ForEach-Object {
            Write-Output "$($_.Name) bytes=$($_.Length) SHA256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: BlueStarOCR-FastSingleEngine-Windows
          path: release/*.zip
          retention-days: 30
          if-no-files-found: error
