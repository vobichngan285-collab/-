name: Build Windows GameTextReader V1.9 Luna original-config TTS experiment
on:
  workflow_dispatch:
  push:
    branches: ['exp/luna-original-config-embedded-tts-20261109']
    paths:
      - 'game_reader/**'
      - 'diagnostics/**'
      - 'native/**'
      - 'tools/**'
      - 'main.py'
      - 'prepare_models.py'
      - 'requirements-win.txt'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-win.txt
      - name: Install lightweight ONNX and local Windows TTS
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-win.txt
          python -m pip install pyinstaller==6.16.0 pytest
          python -c "import rapidocr, onnxruntime; print('rapidocr',rapidocr.__file__);print('onnxruntime',onnxruntime.__version__)"
          python -c "from winrt.windows.media.speechsynthesis import SpeechSynthesizer; from winrt.windows.media.playback import MediaPlayer; print('WinRT speech installed')"
      - name: Test source syntax and screen coordinate logic
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'A unit test failed; packaging is forbidden' }
          python -m compileall -q main.py game_reader
          if ($LASTEXITCODE -ne 0) { throw 'Source compileall failed' }
      - name: Prepare only official PP-OCRv6 Small DET + REC weights
        shell: pwsh
        run: |
          python prepare_models.py
      - name: Verify Small OCR English/Chinese menu (source)
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_ocr_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          python main.py --self-test-ocr
          if (Test-Path $testLog) { Get-Content $testLog }
          if ($LASTEXITCODE -ne 0) { throw 'Source OCR recognition probe failed' }
      - name: Build lean portable EXE folder
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed --name GameTextReader --collect-data rapidocr --collect-binaries onnxruntime --collect-all winrt --collect-all tk_uia --collect-all azure.cognitiveservices.speech --hidden-import azure.cognitiveservices.speech --add-data 'models;models' main.py
          if (-not (Test-Path dist/GameTextReader/GameTextReader.exe)) { throw 'EXE missing' }
      - name: Enable Microsoft C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build independent Guangrong x64 voice host (NO vendor binaries)
        shell: pwsh
        run: |
          cl /nologo /MT /O2 /EHsc /std:c++17 /Fe:dist/GameTextReader/GuangrongHost.exe native/guangrong_host.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Independent native TTS helper did not compile' }
          if (-not (Test-Path dist/GameTextReader/GuangrongHost.exe)) { throw 'Native helper EXE missing' }
      - name: Exercise standalone helper with CI-only fake voice
        shell: pwsh
        run: |
          cl /nologo /LD /EHsc /std:c++17 /Fe:"$env:RUNNER_TEMP/fake_grtts_x64.dll" native/fake_grtts.cpp
          if ($LASTEXITCODE -ne 0) { throw 'CI simulated voice DLL did not compile' }
          python tools/test_grtts_host.py dist/GameTextReader/GuangrongHost.exe "$env:RUNNER_TEMP/fake_grtts_x64.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native helper failed voice enumeration and PCM stream test' }
      - name: Remove duplicated RapidOCR model weights
        shell: pwsh
        run: |
          # V1.8 ships exactly Small DET + Small REC in _internal/models.
          # --collect-data rapidocr otherwise duplicates all four weights.
          $extra = 'dist/GameTextReader/_internal/rapidocr/models'
          foreach ($name in @('PP-OCRv6_det_small.onnx','PP-OCRv6_rec_small.onnx','PP-OCRv6_det_medium.onnx','PP-OCRv6_rec_medium.onnx')) {
            $duplicate = Join-Path $extra $name
            if (Test-Path $duplicate) {
              Remove-Item $duplicate -Force
              Write-Output "Removed redundant weight: $name"
            }
          }
          # All OCR calls use use_cls=False. PyInstaller also collects an
          # unused old angle-classification model; do not ship dead weights.
          $unusedCls = @(Get-ChildItem dist/GameTextReader/_internal/rapidocr -Recurse -Filter '*cls*.onnx' -ErrorAction SilentlyContinue)
          foreach ($file in $unusedCls) {
            Remove-Item $file.FullName -Force
            Write-Output "Removed unused angle classifier: $($file.Name)"
          }
      - name: Verify bundled models
        shell: pwsh
        run: |
          $names = @('PP-OCRv6_det_small.onnx','PP-OCRv6_rec_small.onnx')
          foreach ($name in $names) {
            $file = Join-Path "dist/GameTextReader/_internal/models" $name
            if (-not (Test-Path $file)) { throw "Missing offline ONNX: $name" }
          }
          $allOnnx = @(Get-ChildItem "dist/GameTextReader" -Recurse -Filter '*.onnx' | Select-Object -ExpandProperty Name)
          foreach ($name in $allOnnx) {
            if ($name -match '(?i)medium') { throw "Medium OCR model must not ship: $name" }
          }
          if (@($allOnnx).Count -ne 2) { throw "Expected 2 Small weights, got $(@($allOnnx).Count): $allOnnx" }
      - name: Truly execute frozen EXE using Small OCR only
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_ocr_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-ocr' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen GUI EXE did not create the OCR verification log' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Frozen OCR failed; exit=$($process.ExitCode)"
          }
      - name: Verify bundled SAPI and WinRT voice API
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_tts_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-tts' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen EXE did not produce voice API verification' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Packaged speech API failed (exit=$($process.ExitCode))"
          }
      - name: Verify frozen Luna original JSON fields reach embedded SDK and worker
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_luna_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-luna' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen Luna config did not generate a test report' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Luna config+embedded SDK worker failed: $report"
          }
          if (Test-Path 'dist/GameTextReader/config..json') {
            throw 'Private original user config must not be bundled'
          }
      - name: Test packaged UI Automation and click-through frame
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_ui_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-ui' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen EXE did not create UI test log' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Frozen UI/overlay test failed (exit=$($process.ExitCode))"
          }
      - name: Launch full frozen V1.9 Tk application for startup verification
        shell: pwsh
        run: |
          $testLog = Join-Path $env:TEMP 'GameTextReader_app_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-app' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen EXE did not create app startup log' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Full V1.9 application startup failed (exit=$($process.ExitCode))"
          }
      - name: Validate third-party Guangrong fallback has no bundled DLL
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -c "from game_reader.guangrong_tts import list_guangrong_voices, chosen_dll_path; v,e = list_guangrong_voices(''); assert not v and e; assert chosen_dll_path('') is None; print('Guangrong optional: clean fallback PASS')"
          $dlls = Get-ChildItem dist/GameTextReader -Recurse -Filter grtts.dll -ErrorAction SilentlyContinue
          if ($dlls) { throw 'Unlicensed grtts.dll must never be in portable ZIP' }
      - name: Verify independent TTS setup and absence of BaoYi routing
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -c "from game_reader.guangrong_setup import RELEASE_URL,ASSET_SHA256,runtime_directory; from game_reader.guangrong_tts import chosen_dll_path; assert 'github.com/shenguangrong/' in RELEASE_URL; assert len(ASSET_SHA256)==64; assert 'GameTextReader' in str(runtime_directory()); assert chosen_dll_path('') is None; print('Independent Guangrong setup ready, external vendor package not bundled')"
          if (Test-Path game_reader/baoyi_speech.py) { throw 'Unexpected unfinished BaoYi adapter' }
          if (-not (Test-Path 'dist/GameTextReader/GuangrongHost.exe')) { throw 'Required native TTS host not bundled' }
          $binary = Get-ChildItem dist/GameTextReader -Recurse -Filter 'grtts*64.dll' -ErrorAction SilentlyContinue
          if ($binary) { throw 'Vendor DLL must be installed from original publisher on user action' }
      - name: Frozen EXE Guangrong native DLL loading regression test
        shell: pwsh
        run: |
          # The fake DLL exists only on CI, outside the product package.
          $env:GR_CI_FAKE_DLL_PATH = Join-Path $env:RUNNER_TEMP 'grtts_x64.dll'
          Copy-Item (Join-Path $env:RUNNER_TEMP 'fake_grtts_x64.dll') $env:GR_CI_FAKE_DLL_PATH -Force
          $testLog = Join-Path $env:TEMP 'GameTextReader_guangrong_loader_selftest.txt'
          Remove-Item $testLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/GameTextReader/GameTextReader.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-guangrong-loader' -Wait -PassThru
          if (-not (Test-Path $testLog)) { throw 'Frozen EXE Guangrong native loader selftest missing' }
          $report = Get-Content $testLog -Raw
          Write-Output $report
          if (($process.ExitCode -ne 0) -or (-not $report.StartsWith('PASS'))) {
            throw "Frozen Guangrong external native DLL loader regression (exit=$($process.ExitCode))"
          }
      - name: Compile standalone BaoYi V2 read-only voice investigator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (-not (Test-Path $csc)) { throw 'Missing .NET Framework compiler' }
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:dist/GameTextReader/BaoYiVoiceInspector_V2.exe .\diagnostics\BaoYiVoiceInspector.cs
          if ($LASTEXITCODE -ne 0) { throw 'BaoYi V2 inspector compile failed' }
          & $csc /nologo /target:exe /platform:x64 /out:"$env:RUNNER_TEMP/BoySpeechSlave_TestDummy.exe" .\diagnostics\ProbeHost.cs
          if ($LASTEXITCODE -ne 0) { throw 'Harmless speech-host dummy compile failed' }
          Copy-Item diagnostics/README_V2.txt dist/GameTextReader/BaoYiVoiceInspector_V2_README.txt
      - name: Test V2 investigator with actual Windows dummy process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path dist/GameTextReader/BaoYiVoiceInspector_V2.exe).Path
          $test = Join-Path $env:TEMP 'BaoYiVoiceInspector_test.txt'
          Remove-Item $test -ErrorAction SilentlyContinue
          $testProcess = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($testProcess.ExitCode -ne 0 -or -not (Test-Path $test) -or -not ((Get-Content $test -Raw).StartsWith('PASS'))) {
            throw 'V2 self-test failed'
          }
          $dummyPath = (Resolve-Path "$env:RUNNER_TEMP/BoySpeechSlave_TestDummy.exe").Path
          $dummy = Start-Process -FilePath $dummyPath -PassThru
          try {
            Start-Sleep -Milliseconds 700
            $scanFile = Join-Path $env:TEMP 'BaoYiVoiceInspector_ci_scan.txt'
            Remove-Item $scanFile -ErrorAction SilentlyContinue
            $scan = Start-Process -FilePath $exe -ArgumentList '--ci-scan' -Wait -PassThru
            if ($scan.ExitCode -ne 0 -or -not (Test-Path $scanFile)) { throw 'V2 scan failed' }
            $report = Get-Content $scanFile -Raw -Encoding UTF8
            if (-not $report.Contains('BoySpeechSlave_TestDummy.exe') -or -not $report.Contains('BoySpeechSlave 运行中：是')) {
              throw 'SpeechSlave dummy was not detected by V2 scanner'
            }
            if (-not $report.Contains('进程位数：')) { throw 'Process architecture was not reported' }
            if ($report.Contains('进程：BaoYiVoiceInspector_V2.exe')) { throw 'Inspector misidentified itself as BaoYi' }
            if ($env:USERPROFILE -and $report.Contains($env:USERPROFILE)) { throw 'Unredacted user home path in report' }
            Write-Output 'PASS: speech-host dummy identified, 32/64 bit checked, own process excluded'
          }
          finally { if ($dummy -and -not $dummy.HasExited) { Stop-Process -Id $dummy.Id -Force -ErrorAction SilentlyContinue } }
      - name: Assemble ONLY portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item docs/README_LUNA_EXPERIMENT.txt dist/GameTextReader/README_LUNA_EXPERIMENT.txt
          Compress-Archive -Path dist/GameTextReader -DestinationPath release/GameTextReader_V1.9_Luna_OriginalConfig_Windows_x64_Experimental.zip -CompressionLevel Optimal -Force
          $size = (Get-Item release/GameTextReader_V1.9_Luna_OriginalConfig_Windows_x64_Experimental.zip).Length
          Write-Output "Portable archive size: $size bytes"
          Copy-Item dist/GameTextReader/BaoYiVoiceInspector_V2.exe release/BaoYiVoiceInspector_V2.exe
          Copy-Item diagnostics/README_V2.txt release/README_V2.txt
          Compress-Archive -Path release/BaoYiVoiceInspector_V2.exe,release/README_V2.txt -DestinationPath release/BaoYiVoiceInspector_V2_ReadOnly.zip -CompressionLevel Optimal -Force
          $v2zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path release/BaoYiVoiceInspector_V2_ReadOnly.zip).Path)
          try {
            if ($v2zip.Entries.Count -ne 2) { throw 'Unexpected V2 ZIP entries' }
          } finally { $v2zip.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: GameTextReader-V1.9-Luna-OriginalConfig-Experimental
          path: release/GameTextReader_V1.9_Luna_OriginalConfig_Windows_x64_Experimental.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: BaoYiVoiceInspector-V2-Windows-x64-ReadOnly
          path: release/BaoYiVoiceInspector_V2_ReadOnly.zip
          if-no-files-found: error
          retention-days: 30
