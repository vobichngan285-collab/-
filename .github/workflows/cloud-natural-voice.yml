name: Windows cloud natural voice feasibility (SAPI & WinRT)
on:
  workflow_dispatch:
  push:
    branches:
      - exp/cloud-natural-voice-interface-20261109
    paths:
      - tools/cloud_voice_feasibility.py
      - .github/workflows/cloud-natural-voice.yml
jobs:
  voice-capability:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install official Windows voice interfaces
        shell: pwsh
        run: |
          python -m pip install pywin32 "winrt-Windows.Media.SpeechSynthesis==4!10.0.28000.2957"
          if ($LASTEXITCODE -ne 0) { throw 'Windows voice dependency installation failed' }
      - name: Execute real SAPI/WinRT synthesis and report available natural voice packages
        shell: pwsh
        run: |
          python tools/cloud_voice_feasibility.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows voice experiment script crashed' }
          if (-not (Test-Path cloud_voice_feasibility.json)) { throw 'Voice feasibility report missing' }
      - name: Upload authentic Windows TTS evidence (no models or licenses)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Natural-Voice-Cloud-Feasibility
          path: cloud_voice_feasibility.json
          retention-days: 30
          if-no-files-found: error
