name: Inspect official LunaTranslator Windows x64 runtime (verbatim)
on:
  workflow_dispatch:
  push:
    branches: ['exp/luna-verbatim-upstream-20261109']
    paths: ['.github/workflows/inspect-upstream-luna.yml']
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download official pinned LunaTranslator release and inspect binary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/HIllya51/LunaTranslator/releases/download/v12.1.3.9/LunaTranslator_x64.zip'
          $file=Join-Path $env:RUNNER_TEMP 'LunaTranslator_official_v12.1.3.9.zip'
          Invoke-WebRequest -Uri $url -OutFile $file
          $sha=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          $extract=Join-Path $env:RUNNER_TEMP 'LunaOriginal'
          Expand-Archive -Path $file -DestinationPath $extract -Force
          $bin=@(Get-ChildItem -LiteralPath $extract -Recurse -Filter 'LunaSubProcess64.exe' -File)
          if ($bin.Count -eq 0) { $bin=@(Get-ChildItem -LiteralPath $extract -Recurse -Filter '*Subprocess*64*.exe' -File) }
          $modules=@(Get-ChildItem -LiteralPath $extract -Recurse -Filter '*CognitiveServices*.dll' -File)
          $ancillary=@(Get-ChildItem -LiteralPath $extract -Recurse -Filter '*win*.dll' -File | Select-Object -First 15)
          $top=@(Get-ChildItem -LiteralPath $extract | Select-Object Name,Mode)
          $info=[ordered]@{
            url=$url
            upstream_release_zip_sha256=$sha
            upstream_release_zip_bytes=(Get-Item $file).Length
            top_level=$top
            speech_exe=@($bin | ForEach-Object { [ordered]@{
              relative_path=$_.FullName.Substring($extract.Length+1)
              size=$_.Length
              sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }})
            cognitive_dlls=@($modules | ForEach-Object { $_.FullName.Substring($extract.Length+1) })
            ancillary_dlls=@($ancillary | ForEach-Object { $_.FullName.Substring($extract.Length+1) })
          }
          $info | ConvertTo-Json -Depth 9 | Out-File upstream_luna_inspection.json -Encoding utf8
          Get-Content upstream_luna_inspection.json -Raw
          if ($bin.Count -eq 0) { throw 'No official original LunaSubProcess64.exe found' }
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-Upstream-Release-Inspection
          path: upstream_luna_inspection.json
          retention-days: 30
